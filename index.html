e:25px;margin:0;font-weight:700}.sub{color:var(--muted);font-size:14px;margin-top:8px;line-height:1.5}.btn{border-radius:22px;padding:11px 19px;background:#f1f1f1;color:#111;font-weight:600}.btn.black{background:#0f0f0f;color:white}.btn.blue{background:#065fd4;color:white}.btn:hover{filter:brightness(.95)}.tabs{display:flex;gap:10px;border-bottom:1px solid var(--line);margin:22px 0 0;overflow:auto}.tab{padding:12px 18px;border-radius:12px 12px 0 0;background:transparent;font-weight:600;color:#555;white-space:nowrap}.tab.active{color:#111;background:#eee;border-bottom:3px solid #111}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:18px}.table{width:100%;border-collapse:collapse;min-width:850px}.table th{text-align:left;color:#666;font-weight:600;padding:17px 14px;border-bottom:1px solid var(--line);white-space:nowrap}.table td{padding:17px 14px;border-bottom:1px solid var(--line);vertical-align:middle}.table tr:last-child td{border-bottom:0}.table tr:hover{background:#fafafa}.titlecell{font-weight:600;font-size:15px}.muted{color:#666;margin-top:5px}.status{display:flex;align-items:flex-start;gap:10px}.dot{width:10px;height:10px;border-radius:50%;background:#666;margin-top:5px;flex-shrink:0}.dot.green{background:#137333}.dot.red{background:#c00}.pill{display:inline-block;border-radius:6px;padding:5px 9px;background:#e8f5e9;color:#137333;font-weight:600}.pill.gray{background:#eee;color:#555}.pill.red{background:#fce8e6;color:#b3261e}.expand{background:none;font-size:21px}.empty{padding:64px 20px;text-align:center;color:#666}.empty .big{font-size:38px;margin-bottom:12px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;margin:18px 0}.notice{background:#eef4ff;border:1px solid #d6e4ff;padding:14px 16px;border-radius:10px;color:#244b7b;line-height:1.5;margin:16px 0}.warn{background:#fff8e1;border-color:#f5dfa0;color:#6b5100}.formhead{position:sticky;top:64px;z-index:4;background:#fff;margin:-30px calc(-1 * clamp(20px,4vw,56px)) 22px;padding:18px clamp(20px,4vw,56px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:15px}.formhead h1{font-size:23px;margin:0}.formhead .actions{display:flex;gap:10px}.section-title{font-size:21px;margin:0 0 8px}.section-desc{color:#666;line-height:1.55;margin:0 0 22px}.account{display:flex;align-items:center;gap:16px}.account .avatar{width:56px;height:56px;font-size:22px}.account b{font-size:17px}.field{display:block;margin:18px 0}.field label{display:block;font-weight:600;color:#555;margin:0 0 8px}.field input,.field textarea,.field select{width:100%;padding:14px 15px;border:1px solid #ccc;border-radius:9px;background:#fff;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border:2px solid #065fd4;padding:13px 14px}.field textarea{min-height:92px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.radioopt{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;line-height:1.5}.radioopt input{margin-top:4px;accent-color:#111}.radioopt small{display:block;color:#666;font-size:13px}.check{display:flex;gap:12px;align-items:flex-start;margin:14px 0;line-height:1.5}.check input{margin-top:3px;accent-color:#111}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin:22px 0}.detail{background:#f8f8f8;padding:18px;border-radius:10px;margin-top:12px;line-height:1.6}.detailgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.detailgrid div{min-width:0}.detailgrid strong{display:block;color:#666;font-size:12px}.progress{height:7px;background:#eee;border-radius:9px;overflow:hidden;margin-top:12px}.progress span{display:block;height:100%;background:#065fd4;width:0;transition:width .4s}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:white;padding:13px 20px;border-radius:9px;z-index:20;box-shadow:0 4px 20px #0003}.hidden{display:none!important}.settingsline{display:flex;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--line)}@media(max-width:850px){.sidebar{width:72px;padding:12px 8px}.nav{justify-content:center;padding:13px 5px}.nav .txt,.sidehead,.sidefoot{display:none}.nav .ico{font-size:20px}.main{padding:22px 16px}.formhead{margin:-22px -16px 18px;padding:15px 16px}.search{width:45vw}.pagehead{align-items:flex-start;flex-direction:column}.grid2{grid-template-columns:1fr}.detailgrid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.top{padding:0 12px;gap:12px}.brand{font-size:15px}.search{display:none}.sidebar{width:58px}.formhead{align-items:flex-start;flex-direction:column}.formhead .actions{width:100%;justify-content:flex-end}.card{padding:17px}.detailgrid{grid-template-columns:1fr}}

<body>
<header class="top"><button class="hamb" aria-label="Menu">☰</button><div class="brand"><span class="logo">▶</span> Studio</div><div class="search"><input id="globalSearch" placeholder="Search across your channel"><button onclick="searchRequests()">⌕</button></div><div class="avatar">D</div></header>
<div class="layout">
<aside class="sidebar">
<div class="account" style="padding:8px 10px 20px;display:block"><div class="avatar" style="margin:auto auto 8px">D</div><div style="text-align:center;font-weight:600">Demo Channel</div><div style="text-align:center;color:#777;font-size:12px;margin-top:4px">Your channel</div></div>
<div class="sidehead">Channel</div>
<a class="nav" href="#" data-page="dashboard"><span class="ico">▦</span><span class="txt">Dashboard</span></a>
<a class="nav" href="#" data-page="content"><span class="ico">▤</span><span class="txt">Content</span></a>
<a class="nav" href="#" data-page="analytics"><span class="ico">▥</span><span class="txt">Analytics</span></a>
<a class="nav" href="#" data-page="community"><span class="ico">♧</span><span class="txt">Community</span></a>
<a class="nav" href="#" data-page="subtitles"><span class="ico">▣</span><span class="txt">Subtitles</span></a>

</aside>
<main class="main" id="main"></main>
</div>
<div id="toast" class="toast hidden"></div>
<script>
const KEY='copyright-test-requests-v1';
let requests=(()=>{try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(saved)?saved.filter(r=>r&&typeof r==='object'&&!Array.isArray(r)):[]}catch(error){console.warn('Saved demo requests could not be read; starting with an empty list.',error);return[]}})(), tab='Removal requests', page='copyright', expanded=null, formMode=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(requests))}catch(error){console.warn('Could not save demo requests in this browser.',error);toast('Browser storage is unavailable. Your demo request may not persist after reload.')}}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),3200)}
function nav(p){page=p;formMode=false;document.querySelectorAll('.nav').forEach(a=>a.classList.toggle('active',a.dataset.page===p));render()}
document.querySelectorAll('.nav').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();nav(a.dataset.page)}));
function render(){const m=document.getElementById('main');if(page!=='copyright'){m.innerHTML='<div class="crumb">Channel / '+esc(page[0].toUpperCase()+page.slice(1))+'</div><h1>'+esc(page[0].toUpperCase()+page.slice(1))+'</h1><div class="card"><h2>Demo workspace</h2><p class="sub">This section is a visual placeholder. The copyright testing workflow is available under Content detection.</p><button class="btn black" onclick="nav(\'copyright\')">Open Content detection</button></div>';return}if(formMode){renderForm();return}renderCopyright()}
function renderCopyright(){const m=document.getElementById('main');let tabs=['Matches','Removal requests','Messages','Archived'];let filtered=requests.filter(r=>tab==='Removal requests'?r.bucket!=='archived':tab==='Archived'?r.bucket==='archived':tab==='Matches'?r.matches&&r.bucket!=='archived':r.message);
let rows=filtered.length?filtered.map(r=>{let cls=r.status==='Resolved'?'green':r.status==='Info needed'?'red':'';let subtitle=r.status==='In progress'?'Under review':r.reason||'';return '<tr><td>▣</td><td><div class="titlecell">'+esc(r.videoTitle||r.url||'Untitled video')+'</div><div class="muted">by '+esc(r.uploader||'Unknown uploader')+'</div></td><td>'+new Date(r.created).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})+'</td><td><div class="titlecell">'+esc(r.owner||'Demo claimant')+'</div></td><td><div class="status"><span class="dot '+cls+'"></span><div>'+esc(r.status)+'<div class="muted">'+esc(subtitle)+'</div></div></div></td><td>'+(r.matches?'<span class="pill">Active</span>':'–')+'</td><td>'+(r.prevent?'On':'–')+'</td><td><button class="expand" aria-label="Expand request" onclick="toggleDetail(\''+r.id+'\')">'+(expanded===r.id?'⌃':'⌄')+'</button></td></tr>'+(expanded===r.id?'<tr><td colspan="8"><div class="detail"><div class="detailgrid"><div><strong>VIDEO URL</strong>'+esc(r.url)+'</div><div><strong>REQUEST ID</strong>'+esc(r.id)+'</div><div><strong>REMOVAL TIMING</strong>'+esc(r.timing)+'</div><div><strong>PREVENT COPIES</strong>'+(r.prevent?'On':'Off')+'</div><div><strong>REVIEW RESULT</strong>'+esc(r.reason||'Pending review')+'</div><div><strong>DECISION TIME</strong>'+(r.decided?new Date(r.decided).toLocaleString():'Pending')+'</div></div><p>'+esc(r.description||'No additional details.')+'</p><div class="progress"><span style="width:'+(r.status==='In progress'?Math.min(92,Math.max(5,(Date.now()-r.created)/r.delay*100)):100)+'%"></span></div><p class="muted">Independent demo only — nothing was submitted to YouTube.</p><button class="btn" onclick="archiveReq(\''+r.id+'\')">Move to archive</button> <button class="btn" onclick="deleteReq(\''+r.id+'\')">Delete demo record</button></div></td></tr>':'')}).join(''):'';
m.innerHTML='<div class="pagehead"><div><h1>Content detection</h1></div><button class="btn" onclick="openForm()">New removal request</button></div><div class="notice"><b>Independent demo.</b> Requests and decisions are simulated locally in this browser. This is not YouTube Studio and cannot submit legal notices or remove videos.</div><div class="tabs">'+tabs.map(t=>'<button class="tab '+(tab===t?'active':'')+'" onclick="setTab(\''+t+'\')">'+t+'</button>').join('')+'</div><div class="tablewrap"><table class="table"><thead><tr><th>Type</th><th>Title</th><th>Requested ↓</th><th>Your content</th><th>Request status</th><th>Find matches</th><th>Automatically prevent copies</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>'+(filtered.length?'':'<div class="empty"><div class="big">▤</div><b>No '+esc(tab.toLowerCase())+' yet</b><p>Demo requests you create will appear here.</p><button class="btn black" onclick="openForm()">New removal request</button></div>')+'</div>'}
function setTab(t){tab=t;expanded=null;renderCopyright()}function toggleDetail(id){expanded=expanded===id?null:id;renderCopyright()}
function openForm(){formMode=true;render()}
function renderForm(){const m=document.getElementById('main');m.innerHTML='<div class="formhead"><div><h1>Request video removal</h1><div class="sub">Enter the details of your demo copyright removal request. This independent simulator does not send legal notices or contact YouTube.</div></div><div class="actions"><button class="btn">Learn more</button><button class="btn black" onclick="submitRequest()">Submit</button></div></div><div class="notice warn"><b>Testing environment.</b> Use fictional examples only. Do not enter real contact details, addresses or signatures. No real removal request is created.</div><div class="card" style="max-width:1248px;margin:0 auto"><div class="account"><div class="avatar">D</div><div><div class="muted">You are signed in as</div><b>Demo Channel</b></div></div></div><form id="requestForm" onsubmit="event.preventDefault();submitRequest()"><div class="card"><h2 class="section-title">1. Videos requested for removal (0)</h2><p class="section-desc">Remember that not all copyrighted content is eligible for removal. Some uses may be protected by fair use and similar laws.</p><div id="videos"><div class="video-entry"><div class="field"><label>Video URL (required)</label><input name="url" type="url" placeholder="https://www.youtube.com/watch?v=..." required></div><div class="field"><label>Video title (optional)</label><input name="videoTitle" placeholder="Video title"></div><div class="field"><label>Uploader/channel name (optional)</label><input name="uploader" placeholder="Channel name"></div></div></div><button type="button" class="btn black" onclick="addVideo()">＋ Add a video</button></div><div class="card"><h2 class="section-title">2. Copyright owner</h2><p class="section-desc">A real copyright removal notice requires contact information. This demo intentionally does not collect physical addresses, phone numbers or real signatures.</p><div class="grid2"><div><div class="field"><label>Affected party</label><select name="affected"><option>Myself</option><option>Company or organization</option><option>Authorized representative</option></select></div><div class="field"><label>Copyright owner name (demo)</label><input name="owner" value="Demo Rights Holder" required></div><div class="field"><label>Demo contact email</label><input name="email" type="email" value="demo@example.invalid" required></div><div class="field"><label>Relationship to copyrighted content (required)</label><textarea name="relationship" required>Fictional test scenario: I created the sample work used in this simulation.</textarea></div></div><div style="padding:12px 6px;line-height:1.5"><b>ⓘ Affected party</b><p class="muted">Only the copyright owner or an authorized representative should submit a real copyright removal request. This demo does not verify ownership or authority.</p></div></div><div class="notice">Use fictional information only. The demo stores records in this browser's local storage.</div></div><div class="card"><h2 class="section-title">3. Removal options</h2><p class="section-desc">Removal timing for targeted videos</p><div class="grid2"><label class="radioopt"><input type="radio" name="timing" value="Scheduled: 7-day notice" checked><span><b>Scheduled: Send a 7-day notice</b><small>Once a real request is validated, the uploader may receive a notice period to remove the video.</small></span></label><label class="radioopt"><input type="radio" name="timing" value="Standard: Request removal now"><span><b>Standard: Request removal now</b><small>A validated request can lead to video removal and a copyright strike.</small></span></label></div><p style="margin-top:22px;font-weight:600">Copies</p><label class="check"><input type="checkbox" name="prevent"><span><b>Prevent future copies of this content from appearing</b><div class="muted">If a real request is valid, YouTube may try to prevent matching uploads.</div></span></label></div><div class="card"><h2 class="section-title">4. Legal agreements</h2><div class="legal-copy"><label class="check"><input type="checkbox" name="goodFaith" required><span>I have a good faith belief that the use of the material in the manner complained of is not authorized by the copyright owner, its agent, or the law.</span></label><label class="check"><input type="checkbox" name="accurate" required><span>The information in this notification is accurate, and I am authorized to act on behalf of the owner of an exclusive right that is allegedly infringed.</span></label><label class="check"><input type="checkbox" name="abuse" required><span>I understand that abuse of a copyright removal process may have consequences.</span></label></div><div class="field" style="max-width:520px"><label>Demo signature (required)</label><input name="signature" placeholder="Type DEMO SIGNATURE" required pattern="DEMO SIGNATURE"></div><div class="notice warn">This is a mock acknowledgement, not a legal signature. Enter exactly <b>DEMO SIGNATURE</b> to continue.</div></div><div class="card"><h2 class="section-title">5. Simulation settings</h2><p class="section-desc">These controls affect only the fictional review result in this demo.</p><div class="field"><label>Simulated decision</label><select name="outcome"><option value="auto">Automatic demo review (varied result)</option><option value="approved">Request appears valid — approved</option><option value="info">More information needed</option><option value="rejected">Request not accepted</option></select></div><div class="field"><label>Additional explanation for the test record</label><textarea name="description" placeholder="Add notes for this test scenario..."></textarea></div><div class="notice">After submission, the simulator waits a random 1–5 minutes before showing the selected decision. The timer continues if you reload this browser.</div></div><div class="form-actions"><button type="button" class="btn" onclick="closeForm()">Cancel</button><button type="submit" class="btn black">Submit demo request</button></div></form>'}
function closeForm(){formMode=false;renderCopyright()}
function addVideo(){const wrap=document.getElementById('videos');const d=document.createElement('div');d.className='video-entry';d.innerHTML='<hr style="border:0;border-top:1px solid #eee;margin:18px 0"><div class="field"><label>Additional video URL</label><input name="url" type="url" placeholder="https://www.youtube.com/watch?v=..." required></div><div class="field"><label>Video title (optional)</label><input name="videoTitle" placeholder="Demo video title"></div><div class="field"><label>Uploader/channel name (optional)</label><input name="uploader" placeholder="Demo uploader"></div><button type="button" class="btn" onclick="this.parentElement.remove()">Remove video</button>';wrap.appendChild(d);document.querySelector('.section-title').textContent='1. Videos requested for removal ('+wrap.children.length+')'}
function closeForm(){formMode=false;renderCopyright()}
function submitRequest(){const f=document.getElementById('requestForm');if(!f.reportValidity())return;const data=new FormData(f);const urls=[...f.querySelectorAll('input[name="url"]')];const id='CT-'+Math.random().toString(36).slice(2,8).toUpperCase();const outcome=data.get('outcome');const delay=(60+Math.floor(Math.random()*241))*1000;const r={id,url:urls.map(x=>x.value.trim()).join(', '),videoTitle:[...f.querySelectorAll('input[name="videoTitle"]')].map(x=>x.value).filter(Boolean).join(', ')||'Video removal request',uploader:[...f.querySelectorAll('input[name="uploader"]')].map(x=>x.value).filter(Boolean).join(', ')||'Demo uploader',owner:data.get('owner'),email:'demo@example.invalid',created:Date.now(),delay,status:'In progress',reason:'Under review',timing:data.get('timing'),prevent:data.has('prevent'),description:data.get('description'),outcome,affected:data.get('affected'),bucket:'active',matches:data.has('prevent'),message:false};requests.unshift(r);save();formMode=false;tab='Removal requests';renderCopyright();toast('Demo request submitted. A decision will appear in 1–5 minutes.');setTimeout(()=>decide(r.id),delay)}
function decide(id){const r=requests.find(x=>x.id===id);if(!r||r.status!=='In progress')return;let result=r.outcome;if(result==='auto'){const n=Math.random();result=n<.48?'approved':n<.76?'info':'rejected'}if(result==='approved'){r.status='Resolved';r.reason='Demo request accepted';r.message=true;r.decision='The demo review found the request complete for this test scenario. In a real process, only the platform can determine whether legal requirements are met.'}else if(result==='info'){r.status='Info needed';r.reason='See message';r.message=true;r.decision='The demo reviewer needs more specific information about the original work or your authority to submit this request. This is a simulated outcome.'}else{r.status='Resolved';r.reason='Not accepted';r.message=true;r.decision='The demo review did not accept this test request. The simulated reason is that the provided scenario did not establish a sufficiently clear basis for removal.'}r.decided=Date.now();save();if(page==='copyright'){renderCopyright()}toast('Review complete for '+id)}
function archiveReq(id){const r=requests.find(x=>x.id===id);if(r){r.bucket='archived';save();expanded=null;renderCopyright();toast('Moved to Archived')}}
function deleteReq(id){if(!confirm('Delete this demo record?'))return;requests=requests.filter(x=>x.id!==id);save();expanded=null;renderCopyright();toast('Demo record deleted')}
function searchRequests(){const q=document.getElementById('globalSearch').value.toLowerCase();if(!q)return;const r=requests.find(x=>(x.videoTitle+x.url+x.id+x.uploader).toLowerCase().includes(q));if(r){tab='Removal requests';expanded=r.id;renderCopyright()}else toast('No matching demo requests')}
setInterval(()=>{let changed=false;requests.forEach(r=>{if(r.status==='In progress'&&Date.now()>=r.created+r.delay){decide(r.id);changed=true}});},5000);
try{render()}catch(error){console.error('Copyright Test failed to render:',error);const main=document.getElementById('main');if(main)main.innerHTML='<div class="card" style="margin:24px"><h2>Content detection could not load</h2><p>The page hit a browser-side error while rendering. Your saved demo requests have not been intentionally deleted.</p><pre style="white-space:pre-wrap;color:#b00020">'+String(error&&error.message||error).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</pre><button class="btn black" onclick="localStorage.removeItem(\'copyright-test-requests-v1\');location.reload()">Reset saved demo data and reload</button></div>'}
</script></body></html>
